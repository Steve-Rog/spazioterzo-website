name: Deploy to production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to confirm the production deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-api-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate D1 and deploy Workers
    if: github.event.inputs.confirm == 'DEPLOY'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck:worker
      # i test girano anche in verify.yml, ma in parallelo: senza questo passo un push rosso verrebbe pubblicato lo stesso
      - run: npm test
      - run: npm run db:migrate:production
      - run: npm run deploy:worker:production
      # il sito pubblico è un Worker separato, pubblicato sull'ambiente di produzione.
      - run: npm run deploy:site:prod
