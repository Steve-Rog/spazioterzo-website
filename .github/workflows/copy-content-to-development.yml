name: Copy production content to development

# Sostituisce i contenuti di sviluppo con quelli pubblicati in produzione, media compresi,
# per lavorare sui testi veri senza toccarli. Non copia utenti né cronologia.
# La direzione opposta non sta qui di proposito: cancellerebbe il lavoro dell'associazione
# e si lancia a mano con `npm run content:dev-to-prod -- --conferma SOVRASCRIVI`.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: copy-content-development
  cancel-in-progress: false

jobs:
  copy:
    name: Copy content and media
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: development
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # il token deve poter leggere produzione e scrivere sviluppo: D1 e R2 di entrambi gli ambienti
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run content:prod-to-dev
