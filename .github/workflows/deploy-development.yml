name: Deploy to development

on:
  push:
    branches: [development]
    paths:
      - "cloudflare/**"
      # il Worker serve anche il back office: viene compilato da admin/, che importa app/ e shared/
      - "admin/**"
      - "app/**"
      - "shared/**"
      - "public/**"
      - ".github/workflows/deploy-development.yml"
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api-development
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate D1 and deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: development
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck:worker
      # i test girano anche in verify.yml, ma in parallelo: senza questo passo un push rosso verrebbe pubblicato lo stesso
      - run: npm test
      - run: npm run db:migrate:dev
      - run: npm run deploy:worker:dev
      # il sito pubblico è un Worker a parte: legge i contenuti dall'API appena pubblicata
      - run: npm run deploy:site:dev
