name: Deploy API to development

on:
  push:
    branches: [development]
    paths:
      - "cloudflare/**"
      - ".github/workflows/deploy-development.yml"
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api-development
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate D1 and deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: development
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck:worker
      - run: npm run db:migrate:dev
      - run: npm run deploy:worker:dev -- --yes
